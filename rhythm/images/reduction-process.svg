<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="250" fill="#faf8f5"/>
  
  <!-- Styling -->
  <style>
    .text { font-family: serif; fill: #333; }
    .label { font-size: 14px; font-weight: bold; }
    .calc { font-size: 16px; font-family: monospace; }
    .result { font-size: 18px; font-weight: bold; }
    .line { stroke: #333; stroke-width: 1; opacity: 0.2; }
  </style>

  <!-- Headers -->
  <text x="30" y="40" class="text label">Time</text>
  <text x="130" y="40" class="text label">Reduction</text>
  <text x="310" y="40" class="text label">Result</text>
  <line x1="20" y1="50" x2="380" y2="50" class="line"/>

  <!-- Row 1: 10:15 -->
  <text x="30" y="85" class="text calc">10:15</text>
  <text x="130" y="85" class="text calc">1+0+1+5 = 7</text>
  <text x="330" y="85" class="text result">7</text>

  <!-- Row 2: 14:23 -->
  <text x="30" y="135" class="text calc">14:23</text>
  <text x="130" y="135" class="text calc">1+4+2+3 = 10</text>
  <text x="330" y="135" class="text result">1</text>

  <!-- Row 3: 23:59 -->
  <text x="30" y="185" class="text calc">23:59</text>
  <text x="130" y="185" class="text calc">2+3+5+9 = 19</text>
  <text x="330" y="185" class="text result">1</text>
  
  <!-- Subtle decorative lines between rows -->
  <line x1="20" y1="105" x2="380" y2="105" class="line"/>
  <line x1="20" y1="155" x2="380" y2="155" class="line"/>
  <line x1="20" y1="205" x2="380" y2="205" class="line"/>
</svg>
