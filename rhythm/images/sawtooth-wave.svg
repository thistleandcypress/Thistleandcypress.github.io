<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="auto">
  <!-- Soft, warm background to match Thistle & Cypress aesthetic -->
  <rect width="100%" height="100%" fill="#faf8f5" />
  
  <!-- Grid Lines (Baseline & Max Peak) -->
  <line x1="80" y1="280" x2="740" y2="280" stroke="#e3ded7" stroke-width="1" />
  <line x1="80" y1="60" x2="740" y2="60" stroke="#e3ded7" stroke-width="1" stroke-dasharray="4 4" />
  
  <!-- Y-Axis Labels -->
  <text x="50" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#7a756e" text-anchor="middle">0 / 9</text>
  <text x="50" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#7a756e" text-anchor="middle">Peak (9)</text>

  <!-- The Sawtooth Waveform -->
  <!-- 6 distinct cycles, charting the climb from minute :00 to :09, dropping at :10, etc. -->
  <path d="M 80,280 
           L 180,60  L 180,280 
           L 280,60  L 280,280 
           L 380,60  L 380,280 
           L 480,60  L 480,280 
           L 580,60  L 580,280 
           L 680,60  L 680,280
           L 740,150" 
        fill="none" 
        stroke="#8c8275" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- X-Axis Timeline Markers (Minutes across the hour) -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#7a756e" text-anchor="middle">
    <!-- Cycle 1 -->
    <circle cx="80" cy="280" r="3.5" fill="#8c8275" />
    <text x="80" y="305">:00</text>
    <text x="180" y="305" fill="#a39c93">:09</text>
    
    <!-- Cycle 2 -->
    <circle cx="180" cy="280" r="3.5" fill="#8c8275" />
    <text x="195" y="305">:10</text>
    <text x="280" y="305" fill="#a39c93">:19</text>
    
    <!-- Cycle 3 -->
    <circle cx="280" cy="280" r="3.5" fill="#8c8275" />
    <text x="295" y="305">:20</text>
    <text x="380" y="305" fill="#a39c93">:29</text>
    
    <!-- Cycle 4 -->
    <circle cx="380" cy="280" r="3.5" fill="#8c8275" />
    <text x="395" y="305">:30</text>
    <text x="480" y="305" fill="#a39c93">:39</text>
    
    <!-- Cycle 5 -->
    <circle cx="480" cy="280" r="3.5" fill="#8c8275" />
    <text x="495" y="305">:40</text>
    <text x="580" y="305" fill="#a39c93">:49</text>
    
    <!-- Cycle 6 -->
    <circle cx="580" cy="280" r="3.5" fill="#8c8275" />
    <text x="595" y="305">:50</text>
    <text x="680" y="305" fill="#a39c93">:59</text>
  </g>

  <!-- Explanatory Labeling Inside the Chart Space -->
  <text x="410" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-style="italic" fill="#8c8275" text-anchor="middle">6 Resets Every Hour</text>
</svg>
