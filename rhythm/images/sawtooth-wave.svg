<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="auto">
  <!-- Soft, warm background to match Thistle & Cypress aesthetic -->
  <rect width="100%" height="100%" fill="#faf8f5" />
  
  <!-- Grid Lines (Baseline 1 & Max Peak 9) -->
  <line x1="80" y1="280" x2="740" y2="280" stroke="#e3ded7" stroke-width="1" />
  <line x1="80" y1="60" x2="740" y2="60" stroke="#e3ded7" stroke-width="1" stroke-dasharray="4 4" />
  
  <!-- Y-Axis Labels -->
  <text x="50" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#7a756e" text-anchor="middle">1</text>
  <text x="50" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#7a756e" text-anchor="middle">9 (Peak)</text>

  <!-- The True Sawtooth Waveform (Peaking at :08, :17, :26, :35, :44, :53) -->
  <path d="M 80,280 
           L 170,60  L 180,280 
           L 270,60  L 280,280 
           L 370,60  L 380,280 
           L 470,60  L 480,280 
           L 570,60  L 580,280 
           L 670,60  L 680,280
           L 740,160" 
        fill="none" 
        stroke="#8c8275" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- X-Axis Timeline Markers (Only showing baseline moments where value = 1) -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#7a756e" text-anchor="middle">
    <!-- Cycle 1 Start -->
    <circle cx="80" cy="280" r="3.5" fill="#8c8275" />
    <text x="80" y="305">10:00</text>
    
    <!-- Cycle 2 Reset -->
    <circle cx="180" cy="280" r="3.5" fill="#8c8275" />
    <text x="180" y="305">10:09</text>
    
    <!-- Cycle 3 Reset -->
    <circle cx="280" cy="280" r="3.5" fill="#8c8275" />
    <text x="280" y="305">10:18</text>
    
    <!-- Cycle 4 Reset -->
    <circle cx="380" cy="280" r="3.5" fill="#8c8275" />
    <text x="380" y="305">10:27</text>
    
    <!-- Cycle 5 Reset -->
    <circle cx="480" cy="280" r="3.5" fill="#8c8275" />
    <text x="480" y="305">10:36</text>
    
    <!-- Cycle 6 Reset -->
    <circle cx="580" cy="280" r="3.5" fill="#8c8275" />
    <text x="580" y="305">10:45</text>
    
    <!-- Horizon Line Wrap (Next Hour Transition) -->
    <circle cx="680" cy="280" r="3.5" fill="#8c8275" />
    <text x="680" y="305">10:54</text>
  </g>

  <!-- Explanatory Labeling Inside the Chart Space -->
  <text x="410" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-style="italic" fill="#8c8275" text-anchor="middle">Resets to Base Value 1 Every 9 Minutes</text>
</svg>
