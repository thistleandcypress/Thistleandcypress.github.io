<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive Garden Layout & Plant Finder – Thistle & Cypress</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="design-tool.css">
  <style>
    .hidden-element { display: none !important; }
    .wizard-step { display: none; }
    .wizard-step.active-step { display: block; }
    .layers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
    .plant-card { border: 1px solid #ddd; padding: 15px; border-radius: 8px; }
  </style>
</head>

<body class="garden-page landscape-design-page">

  <main class="post-content" role="main">
    <div class="wizard-container soft-band">
      <form id="gardenWizardForm" novalidate>
        
        <fieldset id="step-geography" class="wizard-step active-step">
          <h3>1. Define Your Regional Climate</h3>
          <div class="input-group">
            <input type="text" id="zipCodeInput" placeholder="Enter ZIP Code" maxlength="5" required>
            <button type="button" class="wizard-btn" onclick="goToStep(2)">Next →</button>
          </div>
        </fieldset>

        <fieldset id="step-style" class="wizard-step">
          <h3>2. Select Your Design Energy</h3>
          <div class="style-grid">
            <label><input type="radio" name="aestheticProfile" value="italian" checked> Italian Abundance</label>
            <label><input type="radio" name="aestheticProfile" value="scottish"> Scottish Resilience</label>
            <label><input type="radio" name="aestheticProfile" value="slowliving"> Sensory Slow Living</label>
          </div>
          <button type="button" class="wizard-btn" onclick="goToStep(1)">← Back</button>
          <button type="button" id="generateReportBtn" class="wizard-btn">Generate Repository ✨</button>
        </fieldset>
      </form>
    </div>

    <section id="gardenResultsWrapper" class="results-container hidden-element">
      <h2 id="locationMetaDisplay"></h2>
      <div id="spatialLayersGrid" class="layers-grid"></div>
      <button onclick="resetWizard()">Search Another ZIP</button>
    </section>
  </main>

  <script>
    function goToStep(step) {
      document.querySelectorAll('.wizard-step').forEach(el => el.classList.remove('active-step'));
      document.getElementById('step-' + (step === 1 ? 'geography' : 'style')).classList.add('active-step');
    }

    document.getElementById('generateReportBtn').addEventListener('click', async () => {
      try {
        const response = await fetch('data/garden-data.json');
        const data = await response.json();
        const zipCode = document.getElementById("zipCodeInput").value.trim();
        const userZone = data.zones[zipCode]; 

        if (!userZone) {
          alert("We couldn't find a zone for that ZIP code.");
          return;
        }

        const suitablePlants = data.plants.filter(plant => {
          if (!plant.hardiness) return false;
          return parseInt(userZone) >= parseInt(plant.hardiness.min) && 
                 parseInt(userZone) <= parseInt(plant.hardiness.max);
        });

        const grid = document.getElementById("spatialLayersGrid");
        grid.innerHTML = '';

        if (suitablePlants.length === 0) {
          grid.innerHTML = '<p>No plants found for Zone ' + userZone + '.</p>';
        } else {
          const grouped = suitablePlants.reduce((acc, plant) => {
            const cat = plant.type || "Other";
            if (!acc[cat]) acc[cat] = [];
            acc[cat].push(plant);
            return acc;
          }, {});

          for (const [category, plants] of Object.entries(grouped)) {
            grid.innerHTML += `<h3>${category.charAt(0).toUpperCase() + category.slice(1)}s</h3>`;
            plants.forEach(plant => {
              grid.innerHTML += `
                <div class="plant-card">
                  <h4>${plant.common_name}</h4>
                  <p><em>${plant.scientific_name ? plant.scientific_name[0] : ''}</em></p>
                  <p><strong>Watering:</strong> ${plant.watering || 'N/A'}</p>
                </div>
              `;
            });
          }
        }
        document.getElementById("gardenResultsWrapper").classList.remove("hidden-element");
        document.getElementById("locationMetaDisplay").innerText = `Repository for Zone ${userZone}`;
      } catch (error) {
        console.error("Data load error:", error);
      }
    });

    function resetWizard() {
      document.getElementById('gardenWizardForm').reset();
      document.getElementById('gardenResultsWrapper').classList.add('hidden-element');
      goToStep(1);
    }
  </script>
</body>
</html>
