name: Daily Plant Fetcher
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: node fetch-plants.js
        env:
          API_KEY: ${{ secrets.PERENUAL_API_KEY }}
      - run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add .
          git commit -m "Update plant data"
          git push
