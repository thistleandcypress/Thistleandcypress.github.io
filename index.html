<!-- Welcome Text -->
 
 <section class="welcome-text">
  <p><b>Welcome to Thistle & Cypress — a place for living intentionally, shaped by food and wine, land, craft, and the quiet rhythms of the seasons.</b></p>

  <p>Our life moves between San Francisco and ten wooded acres in northwest Pennsylvania. One place is full of work, friends, farmers markets, and the pull of good restaurants; the other is where we’re slowly building the home we’ll retire to. The movement between them has become part of our rhythm — two landscapes teaching us different ways of paying attention.</p>

  <p>On the Pennsylvania land, we’re learning what it means to build a meaningful life: cooking and baking, tending the garden, caring for the woods, sharing wine and stories, traveling well, and creating a home that reflects the natural world.</p>

  <p>The name carries the two traditions that shape this work. The <b>thistle</b>, long a symbol of Scottish resilience, reminds us that a meaningful life grows through patience and effort. The <b>cypress</b>, a quiet sentinel of the Italian landscape, speaks to endurance, stewardship, and the passage of time.</p>

  <p class="invitation">This is our table, our garden, our work. Pull up a chair.</p>
</section>
