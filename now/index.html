<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thistle & Cypress | Connected Rhythms</title>
  
  <!-- Tell search engines not to index this utility page -->
  <meta name="robots" content="noindex, follow">
  
  <!-- Link back up to your root styles -->
  <link rel="stylesheet" href="../style.css">
  
  <!-- Custom minimalist inline styling for the mobile link stack -->
  <style>
    body.link-page {
      background-color: #faf8f5;
      color: #333333;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .link-container {
      width: 100%;
      max-width: 480px;
      padding: 40px 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .link-header h1 {
      font-size: 1.8rem;
      margin-bottom: 5px;
    }
    .link-header p {
      font-style: italic;
      font-size: 0.95rem;
      margin-bottom: 30px;
      opacity: 0.8;
    }
    .button-stack {
      display: flex;
      flex-direction: column;
      gap: 16px; /* Perfect breathing room between tap targets */
      margin-bottom: 40px;
    }
    .bio-link {
      display: block;
      background-color: #ffffff; /* Clean white buttons against the cream background */
      color: #333333;
      text-decoration: none;
      padding: 18px 20px; /* Generous padding for easy thumb-tapping */
      border: 1px solid #e6e1da;
      border-radius: 4px;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .bio-link:hover, .bio-link:active {
      background-color: #f4f0ea;
      border-color: #cbc4b9;
    }
    .link-footer {
      font-size: 0.8rem;
      opacity: 0.6;
      margin-top: auto;
    }
  </style>
</head>

<body class="link-page">

  <div class="link-container">
    
    <!-- Minimalist Header -->
    <header class="link-header">
      <h1>Thistle & Cypress</h1>
      <p>Rhythms for a seasonal, home-centered life.</p>
    </header>

    <!-- The Thumb-Friendly Button Stack -->
    <main class="button-stack" role="main">
      
      <!-- Button 1: Dynamic Top Feature (Update this one often) -->
      <a href="../kitchen/" class="bio-link">
        On the Blog: Traditional Regional Pasta Methods
      </a>
      
      <!-- Button 2: Core Seasonal Pillar -->
      <a href="../garden/" class="bio-link">
        Explore the Spring Garden Guide
      </a>
      
      <!-- Button 3: Newsletter Sign-Up -->
      <a href="mailto:thistleandcypress@gmail.com?subject=Please add me to Thistle & Cypress updates" class="bio-link">
        Join Our Seasonal Journal Newsletter
      </a>
      
      <!-- Button 4: Main Homepage Escape -->
      <a href="../index.html" class="bio-link">
        Visit the Homepage
      </a>
      
    </main>

    {% include footer.html %}

  </div>

</body>
</html>
