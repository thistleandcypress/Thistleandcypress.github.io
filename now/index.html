<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thistle & Cypress | Connected Rhythms</title>
   
  <meta name="robots" content="noindex, follow">
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Source+Sans+3:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="/style.css">
  
  <style>
    /* Full Page Immersive Background matching the Homepage Hero */
    body.link-page {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: "Source Sans 3", Arial, sans-serif;
      color: #ffffff;
      background:
        linear-gradient(
          180deg,
          rgba(22,35,30,.82),
          rgba(22,35,30,.70) 50%,
          rgba(22,35,30,.88)
        ),
        url("/Pillar Background Thistle and Cypress About.jpg")
        center / cover no-repeat fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* Strict Centered Column for All Stack Elements */
    .link-container {
      width: 100%;
      max-width: 480px;
      padding: 50px 20px 40px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin: 0 auto;
    }

    /* Crest & Header */
    .link-crest {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 50%;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
      background: rgba(255,255,255,0.95);
      padding: 4px;
      margin-bottom: 20px;
    }

    .link-header .eyebrow {
      font-size: 0.8rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.85);
      margin-bottom: 8px;
    }

    .link-header h1 {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(2.4rem, 6vw, 3rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      margin: 0 0 10px 0;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .link-header .tagline {
      font-family: "Playfair Display", Georgia, serif;
      font-style: italic;
      font-size: 1.1rem;
      margin: 0 0 32px 0;
      color: rgba(255,255,255,0.95);
      text-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }

    /* Unified Button Stack */
    .button-stack {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 35px;
    }

    .bio-link {
      display: block;
      width: 100%;
      background-color: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      color: #2f2a26;
      text-decoration: none;
      padding: 18px 22px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 8px;
      font-weight: 400;
      font-size: 1.02rem;
      line-height: 1.5;
      box-sizing: border-box;
      text-align: left;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .bio-link:hover, .bio-link:active {
      transform: translateY(-2px);
      background-color: #ffffff;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }

    .link-meta-tag {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #2f5d50;
      margin-bottom: 4px;
    }

    /* Editorial Brand Signature */
    .link-brand-signature {
      font-family: "Playfair Display", Georgia, serif;
      font-style: italic;
      font-size: 0.98rem;
      color: rgba(255, 255, 255, 0.95);
      margin-bottom: 25px;
      letter-spacing: 0.02em;
      text-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    /* Seamless Borderless White Footer Styling */
    .link-footer-area {
      width: 100%;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 10px 0 0 0;
      margin: 0 auto;
    }

    .link-footer-area footer,
    .link-footer-area .footer-inner,
    .link-footer-area div {
      background: transparent !important;
      background-color: transparent !important;
      border: none !important;
      box-shadow: none !important;
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
    }

    .link-footer-area,
    .link-footer-area p,
    .link-footer-area span,
    .link-footer-area div {
      color: #ffffff !important;
      font-size: 0.85rem !important;
      line-height: 1.6 !important;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5) !important;
      opacity: 0.92;
    }

    .link-footer-area a {
      color: #ffffff !important;
      font-weight: 500 !important;
      text-decoration: underline !important;
      text-underline-offset: 3px !important;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5) !important;
    }

    .link-footer-area a:hover {
      color: #9fb7a6 !important;
    }
  </style>
</head>

      <h1>Thistle &amp; Cypress</h1>
