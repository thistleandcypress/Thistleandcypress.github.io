<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thistle & Cypress | Connected Rhythms</title>
   
  <meta name="robots" content="noindex, follow">
  
  <link rel="stylesheet" href="/style.css">
  
  <style>
    body.link-page {
      background-color: #faf8f5;
      color: #333333;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .link-container {
      width: 100%;
      max-width: 480px;
      padding: 40px 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .link-header h1 {
      font-size: 1.8rem;
      margin-bottom: 5px;
    }
    .link-header p {
      font-style: italic;
      font-size: 0.95rem;
      margin-bottom: 30px;
      opacity: 0.8;
    }
    .button-stack {
      display: flex;
      flex-direction: column;
      gap: 16px; /* Perfect breathing room between tap targets */
      margin-bottom: 40px;
    }
    .bio-link {
      display: block;
      background-color: #ffffff; /* Clean white buttons against the cream background */
      color: #333333;
      text-decoration: none;
      padding: 18px 20px; /* Generous padding for easy thumb-tapping */
      border: 1px solid #e6e1da;
      border-radius: 4px;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .bio-link:hover, .bio-link:active {
      background-color: #f4f0ea;
      border-color: #cbc4b9;
    }
    .link-footer {
      font-size: 0.8rem;
      opacity: 0.6;
      margin-top: auto;
    }
  </style>
</head>

<body class="link-page">

  <div class="link-container">
    
    <header class="link-header" style="text-align: center; padding-top: 20px;">
      <img src="/Thistle and Cypress Common Roots.PNG" alt="Thistle & Cypress Logo" width="140" style="display: block; margin: 0 auto 10px auto;">
      <h1 style="font-size: 1.6rem; margin: 0 0 5px 0;">Thistle & Cypress</h1>
      <p style="font-style: italic; font-size: 0.9rem; margin: 0 0 25px 0; opacity: 0.8;">Rhythms for a seasonal, home-centered life.</p>
    </header>

    <main class="button-stack" role="main">
      
      <a href="/kitchen/baking/sscake.html" class="bio-link">
        On the Blog: Fresh Strawberry Shortcake for Rick's Birthday 
      </a>
      
      <a href="/garden/perennials/front-flower.html" class="bio-link">
        In the Garden: Restoring the front yard
      </a>
      
      <a href="mailto:thistleandcypress@gmail.com?subject=Please add me to Thistle & Cypress updates" class="bio-link">
        Join Our Seasonal Journal Newsletter
      </a>
      
      <a href="/" class="bio-link">
        Visit the Homepage
      </a>
      
    </main>

    {% include footer.html %}

  </div>

</body>
</html>
